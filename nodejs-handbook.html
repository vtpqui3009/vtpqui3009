<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0"><title>Sổ tay Node.js</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Bố cục: thanh tiến độ trên cùng, mục lục bên trái (chip ngang khi màn hình hẹp), nội dung một mục mỗi lần.
     Thứ tự mục là thứ tự học: nền tảng -> runtime -> API -> dữ liệu -> test -> queue -> AWS -> vận hành -> phỏng vấn. */
  :root {
    --bg:#f2f5f9; --surface:#ffffff; --surface2:#e9eef5; --ink:#131b2b; --muted:#56627a; --line:#d4dbe7;
    --accent:#0a6f86; --accent-soft:#d9eef3; --ok:#177a3e; --warn:#9a5a00; --bad:#bf312c; --info:#2a5cc4;
    --code-bg:#eef2f8; --c-kw:#8a3fb8; --c-str:#17703d; --c-com:#76839b; --c-num:#b5560a;
    --font-head:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0a0f17; --surface:#121a28; --surface2:#1a2438; --ink:#e3e9f3; --muted:#93a1b9; --line:#27324b;
    --accent:#52c4da; --accent-soft:#12303a; --ok:#4cd38c; --warn:#f3b04c; --bad:#ff7f78; --info:#7da9ff;
    --code-bg:#0c121d; --c-kw:#c69bff; --c-str:#7fdc9f; --c-com:#6f7e98; --c-num:#f0a35f; color-scheme:dark; } }
  :root[data-theme="dark"] {
    --bg:#0a0f17; --surface:#121a28; --surface2:#1a2438; --ink:#e3e9f3; --muted:#93a1b9; --line:#27324b;
    --accent:#52c4da; --accent-soft:#12303a; --ok:#4cd38c; --warn:#f3b04c; --bad:#ff7f78; --info:#7da9ff;
    --code-bg:#0c121d; --c-kw:#c69bff; --c-str:#7fdc9f; --c-com:#6f7e98; --c-num:#f0a35f; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.6;
         padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0 48px; }
  body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); background:var(--bg); z-index:30; }
  a { color:var(--accent); } h1,h2,h3 { font-family:var(--font-head); text-wrap:balance; margin:0; line-height:1.25; }
  h2 { font-size:25px; margin-bottom:6px; } h3 { font-size:17px; margin-bottom:6px; } h4 { margin:0 0 4px; font-size:14px; }
  p { margin:0 0 10px; } ul,ol { margin:0 0 10px; padding-left:20px; } li { margin:2px 0; }
  code { font-family:var(--font-mono); font-size:.88em; background:var(--code-bg); border:1px solid var(--line); padding:0 5px; border-radius:4px; }
  .wrap { max-width:1200px; margin:0 auto; }
  .top { position:sticky; top:env(safe-area-inset-top, 0px); z-index:25; background:var(--bg); padding:10px 0 8px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; }
  .brand { font:700 18px var(--font-head); } .brand span { font:400 12px var(--font-body); color:var(--muted); margin-left:8px; }
  .prog { display:flex; align-items:center; gap:8px; margin-left:auto; font-size:12px; color:var(--muted); }
  .bar { width:150px; height:8px; border-radius:99px; background:var(--surface2); border:1px solid var(--line); overflow:hidden; } .bar i { display:block; height:100%; background:var(--accent); width:0; transition:width .3s; }
  .shell { display:grid; grid-template-columns:1fr; gap:14px; padding-top:12px; }
  @media (min-width:960px) { .shell { grid-template-columns:210px minmax(0,1fr); gap:22px; } }
  #nav { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
  @media (min-width:960px) { #nav { flex-direction:column; position:sticky; top:calc(env(safe-area-inset-top, 0px) + 64px); align-self:start; overflow:visible; } }
  #nav a { white-space:nowrap; text-decoration:none; color:var(--ink); border:1px solid var(--line); background:var(--surface); padding:6px 11px; border-radius:8px; font-size:13px; display:flex; gap:8px; align-items:baseline; }
  #nav a i { font:600 11px var(--font-mono); color:var(--muted); font-style:normal; } #nav a.on { background:var(--accent); border-color:var(--accent); color:#fff; } #nav a.on i { color:#e4f7fb; }
  main { min-width:0; display:flex; flex-direction:column; gap:14px; }
  .lead { color:var(--muted); max-width:72ch; }
  .box { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; min-width:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; } .grid .box { height:100%; }
  .note { border-left:3px solid var(--accent); background:var(--surface2); padding:9px 12px; border-radius:0 8px 8px 0; margin:10px 0; } .note > b:first-child { display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:2px; }
  .note.warn { border-color:var(--warn); } .note.bad { border-color:var(--bad); } .note.ok { border-color:var(--ok); } .note.say { border-color:var(--info); }
  .tw { overflow-x:auto; margin:8px 0; } table { border-collapse:collapse; width:100%; font-size:13.5px; } th,td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:top; } th { color:var(--muted); font-size:12px; font-weight:600; white-space:nowrap; }
  .codebox { position:relative; margin:8px 0; } .codebox .ct { font:500 11px var(--font-mono); color:var(--muted); padding:0 2px 3px; }
  pre { margin:0; background:var(--code-bg); border:1px solid var(--line); border-radius:8px; padding:11px 12px; overflow-x:auto; font:13px/1.55 var(--font-mono); tab-size:2; } pre code { background:none; border:0; padding:0; font-size:inherit; }
  .k { color:var(--c-kw); } .s { color:var(--c-str); } .c { color:var(--c-com); font-style:italic; } .n { color:var(--c-num); }
  button { font:500 13px var(--font-body); color:var(--ink); background:var(--surface2); border:1px solid var(--line); border-radius:7px; padding:6px 11px; cursor:pointer; } button:hover { border-color:var(--accent); }
  button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible { outline:2px solid var(--info); outline-offset:2px; } button:disabled { opacity:.45; cursor:not-allowed; }
  button.on { background:var(--accent); color:#fff; border-color:var(--accent); } .copy { position:absolute; right:6px; top:20px; padding:2px 8px; font-size:11px; opacity:.85; }
  .dg { overflow-x:auto; margin:10px 0; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px; } .dg svg { display:block; width:100%; height:auto; min-width:560px; margin:0 auto; }
  .dg text { fill:var(--ink); font-family:var(--font-body); } .dg .sub { fill:var(--muted); } .dg .lbl { fill:var(--muted); font-size:11px; } .dg .lblbg { fill:var(--surface); }
  .dg .n-a rect { fill:var(--accent-soft); stroke:var(--accent); } .dg .n-m rect { fill:var(--surface2); stroke:var(--line); } .dg .n-ok rect { fill:color-mix(in srgb, var(--ok) 16%, var(--surface)); stroke:var(--ok); }
  .dg .n-warn rect { fill:color-mix(in srgb, var(--warn) 16%, var(--surface)); stroke:var(--warn); } .dg .n-bad rect { fill:color-mix(in srgb, var(--bad) 16%, var(--surface)); stroke:var(--bad); } .dg .n-info rect { fill:color-mix(in srgb, var(--info) 14%, var(--surface)); stroke:var(--info); }
  .dg rect { stroke-width:1.5; } .dg .edge { stroke:var(--muted); stroke-width:1.5; fill:none; } .dg .edge.dash { stroke-dasharray:5 4; }
  .lab { border:1.5px dashed var(--accent); border-radius:10px; padding:14px 16px; background:var(--surface); } .lab > .lh { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .lab .tag { font:600 11px var(--font-mono); color:var(--accent); letter-spacing:.06em; text-transform:uppercase; } .lab label { font-size:13px; display:flex; gap:6px; align-items:center; cursor:pointer; }
  .expect { border:1px solid var(--ok); border-radius:8px; padding:8px 12px; margin:8px 0; } .expect b { color:var(--ok); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  details { border-top:1px solid var(--line); padding-top:6px; margin-top:8px; } summary { cursor:pointer; font-weight:600; font-size:13px; }
  .pn { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  /* Mô phỏng event loop */
  .sim { display:grid; grid-template-columns:minmax(0,1fr); gap:12px; } .sim > div { min-width:0; } @media (min-width:860px) { .sim { grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); } }
  .lane { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; border:1px solid var(--line); border-radius:8px; padding:5px 8px; margin-bottom:6px; min-height:42px; background:var(--surface); transition:border-color .2s, background .2s; }
  .lane.hot { border-color:var(--accent); background:var(--accent-soft); } .lane .ln { width:150px; font-size:12px; font-weight:600; flex:none; } .lane .ln small { display:block; font-weight:400; color:var(--muted); font-size:11px; }
  .item { font:11px var(--font-mono); background:var(--surface2); border:1px solid var(--line); border-radius:6px; padding:2px 7px; white-space:nowrap; }
  .stackbar { border:1px solid var(--accent); border-radius:8px; padding:7px 10px; background:var(--surface); margin-bottom:8px; min-height:52px; } .stackbar b { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); display:block; }
  .console { background:var(--code-bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:13px/1.6 var(--font-mono); min-height:56px; }
  .opt { display:block; width:100%; text-align:left; margin:4px 0; font-family:var(--font-mono); font-size:12px; white-space:normal; overflow-wrap:anywhere; } .opt.right { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 14%, var(--surface)); } .opt.wrong { border-color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, var(--surface)); }
  /* Flashcard */
  .fc { border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:12px 14px; } .fc.known { border-color:var(--ok); } .fc .q { font-weight:600; } .fc .a { margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  .fc .row { display:flex; justify-content:space-between; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; } .fc label { font-size:13px; display:flex; gap:6px; align-items:center; cursor:pointer; } .gtag { font:600 10px var(--font-mono); color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Sổ tay Node.js <span>ôn nhanh mức dev ~2 năm · tiếng Việt</span></div>
    <div class="prog"><span id="ptxt"></span><div class="bar" role="img" aria-label="Tiến độ ôn tập"><i id="pbar"></i></div></div>
  </header>
  <div class="shell">
    <nav id="nav" aria-label="Mục lục"></nav>
    <main id="main"></main>
  </div>
</div>

<script>
'use strict';
/* ============ Tiện ích ============ */
const $ = (s, r = document) => r.querySelector(s);
const mem = {};
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v === null ? (mem[k] ?? null) : v; } catch { return mem[k] ?? null; } },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch {} },
};
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* Tô màu code rất nhẹ: chú thích, chuỗi, từ khóa, số */
const KW = new Set('const let var function return if else for while do await async import from export new class extends try catch finally throw typeof of in type interface default break continue switch case null undefined true false this yield satisfies as implements readonly SELECT FROM WHERE INSERT INTO VALUES UPDATE SET DELETE JOIN ON BEGIN COMMIT ROLLBACK CREATE TABLE INDEX EXPLAIN ANALYZE ORDER BY LIMIT AND OR AS ENV RUN COPY WORKDIR USER CMD EXPOSE'.split(' '));
function hl(src, lang) {
  const hash = ['bash', 'yaml', 'dockerfile'].includes(lang), dash = lang === 'sql';
  const com = hash ? '#[^\\n]*' : dash ? '--[^\\n]*' : '\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/';
  const re = new RegExp('(' + com + ')|("(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\'|`(?:[^`\\\\]|\\\\.)*`)|(\\b[A-Za-z_][A-Za-z0-9_]*\\b)|(\\b\\d[\\d_.]*\\b)', 'g');
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="c">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="s">' + esc(m[2]) + '</span>';
    else if (m[3]) out += KW.has(m[3]) ? '<span class="k">' + m[3] + '</span>' : esc(m[3]);
    else out += '<span class="n">' + m[4] + '</span>';
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
const code = (src, lang = 'js', title = '') => '<div class="codebox">' + (title ? '<div class="ct">' + title + '</div>' : '') + '<button class="copy" data-copy>Sao chép</button><pre><code>' + hl(src.trim(), lang) + '</code></pre></div>';
const note = (kind, html) => '<div class="note ' + kind + '"><b>' + { tip: 'Mẹo', warn: 'Cẩn thận', bad: 'Bẫy hay gặp', ok: 'Nhớ', say: 'Có thể nói' }[kind] + '</b>' + html + '</div>';
const T = (head, rows) => '<div class="tw"><table><thead><tr>' + head.map((x) => '<th>' + x + '</th>').join('') + '</tr></thead><tbody>' + rows.map((r) => '<tr>' + r.map((c) => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
const cards = (arr) => '<div class="grid">' + arr.map(([t, h]) => '<div class="box"><h3>' + t + '</h3>' + h + '</div>').join('') + '</div>';
const box = (html) => '<div class="box">' + html + '</div>';
const head = (t, lead) => '<div><h2>' + t + '</h2><p class="lead">' + lead + '</p></div>';

/* Vẽ sơ đồ SVG từ danh sách ô và mũi tên */
let dgN = 0;
function dg({ w, h, nodes, edges = [] }) {
  const id = 'ah' + (dgN++), N = {};
  nodes.forEach((n) => (N[n.id] = n));
  const nodeSvg = (n) => {
    const lines = n.t.split('\n'), lh = 15, total = lines.length * lh, y0 = n.y + n.h / 2 - total / 2 + 11;
    return '<g class="n-' + (n.tone || 'm') + '"><rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="8"/>' +
      lines.map((l, i) => '<text class="' + (i ? 'sub' : '') + '" x="' + (n.x + n.w / 2) + '" y="' + (y0 + i * lh) + '" text-anchor="middle" font-size="' + (i ? 11 : 13) + '" font-weight="' + (i ? 400 : 600) + '">' + esc(l) + '</text>').join('') + '</g>';
  };
  const edgeSvg = ([a, b, label, dash]) => {
    const A = N[a], B = N[b], ax = A.x + A.w / 2, ay = A.y + A.h / 2, bx = B.x + B.w / 2, by = B.y + B.h / 2, dx = bx - ax, dy = by - ay;
    const k1 = Math.min(A.w / 2 / Math.abs(dx || 1e-9), A.h / 2 / Math.abs(dy || 1e-9)), k2 = Math.min((B.w / 2 + 4) / Math.abs(dx || 1e-9), (B.h / 2 + 4) / Math.abs(dy || 1e-9));
    const x1 = ax + dx * k1, y1 = ay + dy * k1, x2 = bx - dx * k2, y2 = by - dy * k2;
    let s = '<line class="edge ' + (dash ? 'dash' : '') + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" marker-end="url(#' + id + ')"/>';
    if (label) { const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, lw = label.length * 6 + 8; s += '<rect class="lblbg" x="' + (mx - lw / 2) + '" y="' + (my - 9) + '" width="' + lw + '" height="16" rx="4" stroke="none"/><text class="lbl" x="' + mx + '" y="' + (my + 3) + '" text-anchor="middle">' + esc(label) + '</text>'; }
    return s;
  };
  return '<div class="dg"><svg viewBox="0 0 ' + w + ' ' + h + '" role="img"><defs><marker id="' + id + '" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker></defs>' +
    edges.map(edgeSvg).join('') + nodes.map(nodeSvg).join('') + '</svg></div>';
}
const nd = (id, x, y, w, h, t, tone) => ({ id, x, y, w, h, t, tone });

/* Lab: có hộp tick, lưu tiến độ */
const LABS = [];
function lab(id, title, goal, body) {
  if (!LABS.find((l) => l.id === id)) LABS.push({ id, title });
  const on = store.get('lab:' + id) === '1';
  return '<div class="lab"><div class="lh"><div><span class="tag">Lab ' + id.toUpperCase() + '</span><h3 style="margin:0">' + title + '</h3></div><label><input type="checkbox" data-lab="' + id + '"' + (on ? ' checked' : '') + '> Đã làm xong</label></div><p><b>Mục tiêu:</b> ' + goal + '</p>' + body + '</div>';
}
const expect = (html) => '<div class="expect"><b>Kết quả mong đợi</b><div>' + html + '</div></div>';

/* ============ Mô phỏng event loop ============ */
const PRESETS = [
  { id: 'basic', t: 'Thứ tự cơ bản', code: "console.log('A');\nsetTimeout(() => console.log('timeout'), 0);\nsetImmediate(() => console.log('immediate'));\nPromise.resolve().then(() => console.log('promise'));\nprocess.nextTick(() => console.log('nextTick'));\nconsole.log('B');",
    prog: [['log', 'A'], ['timeout', [['log', 'timeout']]], ['immediate', [['log', 'immediate']]], ['then', [['log', 'promise']]], ['tick', [['log', 'nextTick']]], ['log', 'B']],
    note: 'Code đồng bộ chạy hết trước. Rồi nextTick, rồi Promise (microtask), sau đó mới tới vòng lặp: timers, poll, check. Lưu ý: trong script chính, <code>setTimeout(0)</code> và <code>setImmediate</code> có thể đổi chỗ tùy máy, đừng dựa vào thứ tự đó.' },
  { id: 'await', t: 'async / await', code: "async function f() {\n  console.log('f: trước await');\n  await null;\n  console.log('f: sau await');\n}\nconsole.log('1');\nf();\nconsole.log('2');",
    prog: [['log', '1'], ['log', 'f: trước await'], ['then', [['log', 'f: sau await']]], ['log', '2']],
    note: 'Phần của hàm async chạy đồng bộ cho đến <code>await</code> đầu tiên. Phần sau await là một microtask, nên "2" in trước "f: sau await".' },
  { id: 'timers', t: 'Microtask giữa các timer', code: "setTimeout(() => {\n  console.log('t1');\n  Promise.resolve().then(() => console.log('p trong t1'));\n}, 0);\nsetTimeout(() => console.log('t2'), 0);",
    prog: [['timeout', [['log', 't1'], ['then', [['log', 'p trong t1']]]]], ['timeout', [['log', 't2']]]],
    note: 'Sau mỗi callback của timer, Node xả microtask ngay (từ Node 11). Nên "p trong t1" nằm giữa t1 và t2.' },
  { id: 'io', t: 'Trong callback I/O', code: "const fs = require('node:fs');\nfs.readFile(__filename, () => {\n  setTimeout(() => console.log('timeout'), 0);\n  setImmediate(() => console.log('immediate'));\n});",
    prog: [['io', [['timeout', [['log', 'timeout']]], ['immediate', [['log', 'immediate']]]]]],
    note: 'Đang ở pha Poll, pha kế tiếp là Check nên <code>setImmediate</code> luôn chạy trước <code>setTimeout</code>. Đây là trường hợp thứ tự được đảm bảo.' },
  { id: 'chain', t: 'nextTick lồng trong Promise', code: "Promise.resolve()\n  .then(() => {\n    console.log('p1');\n    process.nextTick(() => console.log('tick trong p1'));\n  })\n  .then(() => console.log('p2'));\nprocess.nextTick(() => console.log('tick'));",
    prog: [['then', [['log', 'p1'], ['tick', [['log', 'tick trong p1']]], ['then', [['log', 'p2']]]]], ['tick', [['log', 'tick']]]],
    note: 'Hàng microtask được xả hết (p1 rồi p2) trước khi quay lại hàng nextTick, nên "tick trong p1" ra sau "p2". Câu hỏi phỏng vấn kinh điển.' },
];
function simulate(prog) {
  const out = [], frames = [], q = { tick: [], micro: [], timer: [], io: [], imm: [] };
  const KEY = { timeout: 'timer', immediate: 'imm', then: 'micro', tick: 'tick', io: 'io' };

      expect('Message thường được log "processed". Message độc bị thử lại tối đa <b>3 lần</b> rồi xuất hiện trong <b>DLQ</b> (xem số message trong DLQ trên console hoặc <code>aws sqs get-queue-attributes</code>). Cuối cùng chạy <code>sam delete</code>.') +
      '<p style="color:var(--muted);font-size:13px">Không có AWS? Bỏ qua lab này, thay bằng Lab 6 (mini-novu) vì cùng cơ chế.</p>') },

  { id: 'ops', label: 'Vận hành, bảo mật', render: () => head('Vận hành và bảo mật', 'Code chạy được chưa đủ. Phần này là sự khác biệt giữa "chạy trên máy tôi" và "chạy production".') +
    cards([
      ['Cấu hình', '<ul><li>Cấu hình qua biến môi trường (12-factor), <b>kiểm tra lúc khởi động</b>, thiếu thì dừng ngay.</li><li>Secret nằm ở secret manager, không nằm trong repo.</li></ul>'],
      ['Log và truy vết', '<ul><li>Log JSON có cấu trúc (pino).</li><li>Gắn <code>requestId</code> vào mọi dòng, truyền xuyên service. <code>AsyncLocalStorage</code> giữ nó mà không phải truyền tay.</li><li>Đừng log secret hay dữ liệu cá nhân.</li></ul>'],
      ['Health check', T(['', 'Hỏi gì', 'Fail thì'], [['Liveness', 'process còn sống?', 'khởi động lại'], ['Readiness', 'sẵn sàng nhận traffic? (DB ok)', 'ngừng chuyển traffic']])],
      ['Chỉ số cần theo dõi', '<p>Mô hình <b>RED</b>: Rate (số request), Errors (tỉ lệ lỗi), Duration (độ trễ p95/p99). Thêm: độ trễ event loop, bộ nhớ, độ sâu queue, số message trong DLQ.</p>'],
    ]) +
    box('<h3>Pipeline CI/CD điển hình</h3>' + dg({ w: 800, h: 80, nodes: [nd('a', 6, 14, 100, 50, 'Commit\nPR', 'm'), nd('b', 120, 14, 108, 50, 'Lint +\ntypecheck', 'a'), nd('c', 242, 14, 100, 50, 'Test', 'a'), nd('d', 356, 14, 100, 50, 'Build\nimage', 'a'), nd('e', 470, 14, 100, 50, 'Push\nregistry', 'a'), nd('f', 584, 14, 100, 50, 'Deploy', 'ok'), nd('g', 698, 14, 96, 50, 'Smoke\nhealth', 'ok')], edges: [['a', 'b'], ['b', 'c'], ['c', 'd'], ['d', 'e'], ['e', 'f'], ['f', 'g']] })) +
    box('<h3>Dockerfile tốt cho Node</h3>' + code("FROM node:22-alpine AS build\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci\nCOPY . .\nRUN npm run build\n\nFROM node:22-alpine\nWORKDIR /app\nENV NODE_ENV=production\nCOPY package*.json ./\nRUN npm ci --omit=dev\nCOPY --from=build /app/dist ./dist\nUSER node\nEXPOSE 3000\nCMD [\"node\", \"dist/main.js\"]", 'dockerfile', 'Dockerfile') +
      '<ul><li><b>Multi-stage</b>: image cuối nhỏ, không chứa công cụ build.</li><li><b>Chạy user <code>node</code></b>, không chạy root.</li><li><b>Không dùng <code>npm start</code> làm PID 1</b>: tín hiệu tắt có thể không tới app. Gọi <code>node</code> trực tiếp.</li><li><code>npm ci</code> dùng đúng lockfile, cho bản build lặp lại được.</li></ul>') +
    box('<h3>Đọc hiểu manifest Kubernetes (đủ để vào dự án EKS)</h3>' + code("apiVersion: apps/v1\nkind: Deployment\nmetadata: { name: api }\nspec:\n  replicas: 3                       # 3 bản chạy song song\n  selector: { matchLabels: { app: api } }\n  template:\n    metadata: { labels: { app: api } }\n    spec:\n      containers:\n        - name: api\n          image: registry/api:1.4.2\n          ports: [{ containerPort: 3000 }]\n          resources:\n            requests: { cpu: 100m, memory: 128Mi }\n            limits: { memory: 256Mi }\n          readinessProbe: { httpGet: { path: /health/ready, port: 3000 } }\n          livenessProbe: { httpGet: { path: /health/live, port: 3000 } }", 'yaml') +
      T(['Khái niệm', 'Ý nghĩa'], [['Pod', 'đơn vị chạy nhỏ nhất, chứa container'], ['Deployment', 'giữ đủ số bản, cập nhật cuốn chiếu'], ['Service', 'địa chỉ ổn định phía trước các pod'], ['Ingress', 'cổng HTTP từ ngoài vào'], ['Probe', 'liveness và readiness như ở trên']])) +
    box('<h3>Bảo mật: danh sách kiểm tra</h3>' + T(['Rủi ro', 'Cách phòng'], [['Injection (SQL, NoSQL, lệnh)', 'query tham số hóa, validate input, không nối chuỗi'], ['Xác thực yếu', 'băm mật khẩu (argon2/bcrypt), token ngắn hạn, giới hạn đăng nhập sai'], ['Phân quyền sai', 'kiểm tra quyền ở server cho MỌI tài nguyên, không tin id từ client'], ['Lộ thông tin', 'không trả stack, không log secret, bật <code>helmet</code>'], ['Thư viện lỗ hổng', '<code>npm audit</code>, khóa phiên bản, cập nhật định kỳ'], ['Lạm dụng', 'rate limit, giới hạn kích thước body, timeout'], ['SSRF', 'không gọi URL do người dùng cung cấp mà không lọc']])) +
    lab('l8', 'Docker và tắt êm', 'Kiểm chứng app nhận SIGTERM và thoát đúng cách trong container.',
      '<p>Lấy API từ Lab 3, thêm đoạn tắt êm ở mục 2, dùng Dockerfile trên (nhớ có script <code>build</code>), rồi:</p>' + code("docker build -t api .\ndocker run --name t -p 3000:3000 api\n# terminal 2\ndocker stop t\ndocker inspect -f '{{.State.ExitCode}}' t", 'bash') +
      expect('Log in ra "shutdown SIGTERM", <code>docker stop</code> xong gần như ngay (không phải đợi 10 giây) và exit code là <b>0</b>. Nếu exit code là <b>137</b>, app không nhận được tín hiệu (thường do dùng <code>npm start</code> làm PID 1).')) },

  { id: 'interview', label: 'Flashcard phỏng vấn', render: () => head('Flashcard phỏng vấn (' + FC.length + ' câu)', 'Đọc câu hỏi, tự trả lời thành tiếng, rồi mới xem đáp án. Bấm "Đã nhớ" khi bạn giải thích được mà không nhìn.') +
    note('say', '<p><b>Khi chưa biết:</b> "Phần đó tôi chưa làm production. Theo cách tôi hiểu thì ..., và tôi sẽ kiểm chứng bằng ...". <b>Khi được hỏi dự án:</b> Tình huống → việc của bạn → cách làm → kết quả đo được. Chỉ nêu số liệu mà bạn thật sự có.</p>') +
    '<div class="chips" id="fcf"></div><div id="fclist" style="display:grid;gap:10px"></div>' },

  { id: 'progress', label: 'Tiến độ', render: () => head('Tiến độ và lộ trình', 'Mọi lab và flashcard bạn đã tick được lưu trong trình duyệt này.') + '<div id="prog"></div>' },
];

/* ============ Dựng giao diện ============ */
const fcState = { g: 'Tất cả' };
function countProgress() {
  const labs = ['l1', 'l2', 'l3', 'l4', 'l5', 'l6', 'l7', 'l8'], labDone = labs.filter((l) => store.get('lab:' + l) === '1').length;
  const fcDone = FC.filter((_, i) => store.get(fcKey(i)) === '1').length;
  return { labs, labDone, fcDone, total: labs.length + FC.length, done: labDone + fcDone };
}
function paintProgress() { const p = countProgress(); $('#pbar').style.width = Math.round((p.done / p.total) * 100) + '%'; $('#ptxt').textContent = 'Đã nhớ ' + p.fcDone + '/' + FC.length + ' · Lab ' + p.labDone + '/' + p.labs.length; }
function renderFlash() {
  const groups = ['Tất cả', ...new Set(FC.map((c) => c[0]))];
  $('#fcf').innerHTML = groups.map((g) => '<button data-fg="' + g + '" class="' + (fcState.g === g ? 'on' : '') + '">' + g + '</button>').join('');
  $('#fclist').innerHTML = FC.map((c, i) => [c, i]).filter(([c]) => fcState.g === 'Tất cả' || c[0] === fcState.g).map(([c, i]) => '<div class="fc ' + (store.get(fcKey(i)) === '1' ? 'known' : '') + '"><span class="gtag">' + c[0] + '</span><div class="q">' + c[1] + '</div><div class="a" hidden>' + c[2] + '</div><div class="row"><button data-ans="1">Xem đáp án</button><label><input type="checkbox" data-fc="' + i + '"' + (store.get(fcKey(i)) === '1' ? ' checked' : '') + '> Đã nhớ</label></div></div>').join('');
}
function renderProgress() {
  const p = countProgress(), pct = Math.round((p.done / p.total) * 100);
  const names = {}; LABS.forEach((l) => (names[l.id] = l.title));
  $('#prog').innerHTML = '<div class="box"><h3>Tổng quan: ' + pct + '%</h3><p>Flashcard đã nhớ: <b>' + p.fcDone + '/' + FC.length + '</b>. Lab đã làm: <b>' + p.labDone + '/' + p.labs.length + '</b>.</p><div class="bar" style="width:100%"><i style="width:' + pct + '%"></i></div></div>' +
    '<div class="box"><h3>Lab</h3>' + T(['Lab', 'Nội dung', 'Mục', 'Xong'], [['l1', 'js'], ['l2', 'node'], ['l3', 'api'], ['l4', 'data'], ['l5', 'test'], ['l6', 'queue'], ['l7', 'aws'], ['l8', 'ops']].map(([id, s]) => [id.toUpperCase(), { l1: 'pLimit: giới hạn song song', l2: 'Chặn event loop và stream', l3: 'API orders', l4: 'N+1 và index trên Postgres', l5: 'Test retry không chờ thật', l6: 'Chạy và sửa mini-novu', l7: 'Lambda + SQS + DLQ (tùy chọn)', l8: 'Docker và tắt êm' }[id], '<a href="#' + s + '">mở mục</a>', store.get('lab:' + id) === '1' ? '<span style="color:var(--ok)">Đã xong</span>' : '—'])) + '</div>' +
    '<div class="grid"><div class="box"><h3>Lộ trình 1 tuần</h3>' + T(['Ngày', 'Làm gì'], [['1', 'Mục 1, Lab 1'], ['2', 'Mục 2 (mô phỏng event loop), Lab 2'], ['3', 'Mục 3, Lab 3'], ['4', 'Mục 4, Lab 4'], ['5', 'Mục 5, Lab 5'], ['6', 'Mục 6, Lab 6, mục 7 (đọc)'], ['7', 'Mục 8, flashcard toàn bộ, tự nói thành tiếng']]) + '</div>' +
    '<div class="box"><h3>Còn 1 giờ?</h3><ol><li>Mục 2: chơi mô phỏng 5 ví dụ (20 phút).</li><li>Flashcard nhóm JS và Node (25 phút).</li><li>Mục 6: đọc 3 lớp chống trùng và vòng đời job (15 phút).</li></ol><p><button id="resetprog">Xóa toàn bộ tiến độ</button></p></div></div>';
  const r = $('#resetprog'); if (r) r.onclick = () => { if (r.dataset.sure) { LABS.forEach((l) => store.set('lab:' + l.id, '0')); ['l1','l2','l3','l4','l5','l6','l7','l8'].forEach((l) => store.set('lab:' + l, '0')); FC.forEach((_, i) => store.set(fcKey(i), '0')); paintProgress(); renderProgress(); } else { r.dataset.sure = '1'; r.textContent = 'Bấm lần nữa để xác nhận xóa'; } };
}

let current = 'start';
function show(id) {
  if (!SECTIONS.find((s) => s.id === id)) id = 'start';
  current = id;
  if (SIM.timer) { clearInterval(SIM.timer); SIM.timer = null; }
  const idx = SECTIONS.findIndex((s) => s.id === id), s = SECTIONS[idx];
  $('#main').innerHTML = s.render() + '<div class="pn">' + (idx > 0 ? '<button data-go="' + SECTIONS[idx - 1].id + '">← ' + SECTIONS[idx - 1].label + '</button>' : '<span></span>') + (idx < SECTIONS.length - 1 ? '<button class="on" data-go="' + SECTIONS[idx + 1].id + '">' + SECTIONS[idx + 1].label + ' →</button>' : '') + '</div>';
  $('#nav').innerHTML = SECTIONS.map((x, i) => '<a href="#' + x.id + '" class="' + (x.id === id ? 'on' : '') + '"><i>' + i + '</i>' + x.label + '</a>').join('');
  if (id === 'node') { SIM.p = 0; SIM.i = 0; SIM.pick = null; renderSim(); }
  if (id === 'interview') renderFlash();
  if (id === 'progress') renderProgress();
  paintProgress(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => show(location.hash.slice(1)));

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, input'); if (!t) return;
  if (t.dataset.go) { location.hash = t.dataset.go; return; }
  if (t.dataset.sp !== undefined) { SIM.p = +t.dataset.sp; SIM.i = 0; SIM.pick = null; if (SIM.timer) { clearInterval(SIM.timer); SIM.timer = null; } renderSim(); return; }
  if (t.dataset.pick !== undefined) { SIM.pick = +t.dataset.pick; renderSim(); return; }
  if (t.dataset.sa) { simAction(t.dataset.sa); return; }
  if (t.dataset.fg) { fcState.g = t.dataset.fg; renderFlash(); return; }
  if (t.dataset.ans) { const a = t.closest('.fc').querySelector('.a'); a.hidden = !a.hidden; t.textContent = a.hidden ? 'Xem đáp án' : 'Ẩn đáp án'; return; }
  if (t.dataset.copy !== undefined) { const txt = t.parentElement.querySelector('code').textContent; const done = () => { t.textContent = 'Đã chép'; setTimeout(() => (t.textContent = 'Sao chép'), 1200); };
    (navigator.clipboard ? navigator.clipboard.writeText(txt).then(done) : Promise.reject()).catch(() => { const r = document.createRange(); r.selectNodeContents(t.parentElement.querySelector('code')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = 'Đã chọn, nhấn Ctrl+C'; }); return; }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.lab) { store.set('lab:' + t.dataset.lab, t.checked ? '1' : '0'); paintProgress(); }
  if (t.dataset.fc !== undefined) { store.set(fcKey(t.dataset.fc), t.checked ? '1' : '0'); t.closest('.fc').classList.toggle('known', t.checked); paintProgress(); }
});
// Đăng ký đầy đủ danh sách lab để tiến độ đúng ngay từ đầu
show(location.hash.slice(1) || 'start');
</script>
</body></html>
