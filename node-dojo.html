<style>
  /* Phong cách: "tem dán" dày nét, bóng cứng, mỗi chặng một màu để nhìn là biết mình đang ở đâu.

  .dg .edge { stroke:var(--ink); stroke-width:2; fill:none; stroke-dasharray:7 6; animation:flow 1s linear infinite; } .dg .edge.solid { stroke-dasharray:none; animation:none; } @keyframes flow { to { stroke-dashoffset:-26; } } @media (prefers-reduced-motion:reduce) { .dg .edge { animation:none; } * { transition:none !important; } }

<script>
'use strict';
/* ================= Tiện ích ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const mem = {};
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v === null ? (mem[k] ?? null) : v; } catch { return mem[k] ?? null; } },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch {} },

const KW = new Set('const let var function return if else for while do await async import from export new class extends try catch finally throw typeof of in type interface default break continue switch case null undefined true false this yield satisfies as implements readonly static public private protected constructor super void SELECT FROM WHERE INSERT INTO VALUES UPDATE SET DELETE JOIN ON BEGIN COMMIT ROLLBACK CREATE TABLE INDEX EXPLAIN ANALYZE ORDER BY LIMIT AND OR AS FOR ENV RUN COPY WORKDIR USER CMD EXPOSE'.split(' '));
function hl(src, lang) {
  const hash = ['bash', 'yaml', 'dockerfile'].includes(lang), dash = lang === 'sql', plain = lang === 'http' || lang === 'tree';
  const com = hash ? '#[^\\n]*' : dash ? '--[^\\n]*' : plain ? '#[^\\n]*' : '\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/';
  const re = new RegExp('(' + com + ')|("(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\'|`(?:[^`\\\\]|\\\\.)*`)|(\\b[A-Za-z_][A-Za-z0-9_]*\\b)|(\\b\\d[\\d_.]*\\b)', 'g');
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="cm">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="s">' + esc(m[2]) + '</span>';
    else if (m[3]) out += !plain && KW.has(m[3]) ? '<span class="k">' + m[3] + '</span>' : esc(m[3]);
    else out += '<span class="n">' + m[4] + '</span>';
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

let dgN = 0;
function dg({ w, h, nodes, edges = [] }) {
  const id = 'ah' + dgN++, N = {}; nodes.forEach((n) => (N[n.id] = n));
  const nodeSvg = (n) => { const lines = n.t.split('\n'), lh = 15, y0 = n.y + n.h / 2 - (lines.length * lh) / 2 + 11;
    return '<g class="t-' + (n.tone || 'm') + '"><rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="10"/>' + lines.map((l, i) => '<text class="' + (i ? 'sub' : '') + '" x="' + (n.x + n.w / 2) + '" y="' + (y0 + i * lh) + '" text-anchor="middle" font-size="' + (i ? 11 : 13) + '" font-weight="' + (i ? 500 : 700) + '">' + esc(l) + '</text>').join('') + '</g>'; };
  const edgeSvg = ([a, b, label, solid]) => { const A = N[a], B = N[b], ax = A.x + A.w / 2, ay = A.y + A.h / 2, bx = B.x + B.w / 2, by = B.y + B.h / 2, dx = bx - ax, dy = by - ay;
    const k1 = Math.min(A.w / 2 / Math.abs(dx || 1e-9), A.h / 2 / Math.abs(dy || 1e-9)), k2 = Math.min((B.w / 2 + 5) / Math.abs(dx || 1e-9), (B.h / 2 + 5) / Math.abs(dy || 1e-9));
    const x1 = ax + dx * k1, y1 = ay + dy * k1, x2 = bx - dx * k2, y2 = by - dy * k2;
    let s = '<line class="edge ' + (solid ? 'solid' : '') + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" marker-end="url(#' + id + ')"/>';
    if (label) { const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, lw = label.length * 6.2 + 10; s += '<rect class="lblbg" x="' + (mx - lw / 2) + '" y="' + (my - 9) + '" width="' + lw + '" height="17" rx="5" stroke="none"/><text class="lbl" x="' + mx + '" y="' + (my + 3.5) + '" text-anchor="middle">' + esc(label) + '</text>'; }
    return s; };
  return '<div class="dg"><svg viewBox="0 0 ' + w + ' ' + h + '" role="img"><defs><marker id="' + id + '" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--ink)"/></marker></defs>' + edges.map(edgeSvg).join('') + nodes.map(nodeSvg).join('') + '</svg></div>';
}

const isDone = (id) => !!store.get('done:' + id);
const quizOf = (id) => byId[id].quiz.map((_, i) => store.get('qz:' + id + ':' + i));
const act = () => { try { return JSON.parse(store.get('act') || '{}'); } catch { return {}; } };
function bump(k, n = 1) { const a = act(), d = today(); a[d] = a[d] || {}; a[d][k] = (a[d][k] || 0) + n; const keys = Object.keys(a).sort().slice(-40); const out = {}; keys.forEach((x) => (out[x] = a[x])); store.set('act', JSON.stringify(out)); }
function streak() { const a = act(); let n = 0, i = 0; if (!a[today()]) i = 1; for (; i < 60; i++) { if (a[addDays(-i)] && Object.values(a[addDays(-i)]).some((v) => v > 0)) n++; else break; } return n; }
function stats() {
  const done = LESSONS.filter((l) => isDone(l.id)).length;
  const qc = LESSONS.reduce((s, l) => s + quizOf(l.id).filter((x) => x === '1').length, 0);
  const labs = LESSONS.reduce((s, l) => s + l.blocks.filter((b) => b.t === 'lab' && store.get('lab:' + b.id) === '1').length, 0);
  const rev = +(store.get('rev') || 0);
  const xp = done * 20 + qc * 5 + labs * 15 + rev * 2;
  return { done, qc, labs, rev, xp };
}
const LEVELS = [[0, 'Tập sự'], [80, 'Biết đường'], [200, 'Junior'], [400, 'Junior vững'], [650, 'Gần 2 năm'], [900, 'Sẵn sàng phỏng vấn']];
function level(xp) { let i = 0; LEVELS.forEach((l, k) => { if (xp >= l[0]) i = k; }); const next = LEVELS[i + 1]; return { name: LEVELS[i][1], pct: next ? ((xp - LEVELS[i][0]) / (next[0] - LEVELS[i][0])) * 100 : 100 }; }
const deck = () => LESSONS.filter((l) => isDone(l.id)).flatMap((l) => l.cards.map((c, i) => ({ id: l.id + ':' + i, l, c })));
const cardSt = (id) => { try { return JSON.parse(store.get('cd:' + id) || 'null'); } catch { return null; } };
const dueCards = () => deck().filter((x) => { const s = cardSt(x.id); return !s || s.d <= today(); });
const nextLesson = () => LESSONS.find((l) => !isDone(l.id)) || null;

    const byCh = {}; PL.res.forEach((r) => { byCh[r.ch] = byCh[r.ch] || { ok: 0, n: 0 }; byCh[r.ch].n++; if (r.ok) byCh[r.ch].ok++; });
    const first = CH.find((c) => byCh[c.n] && byCh[c.n].ok < byCh[c.n].n);
    return '<div class="card" style="max-width:720px"><h2>Kết quả đo trình độ</h2>' + tbHtml(['Chặng', 'Đúng', 'Gợi ý'], CH.map((c) => { const r = byCh[c.n] || { ok: 0, n: 0 }; return [c.n + '. ' + c.t, r.ok + '/' + r.n, r.ok === r.n ? 'Lướt qua, làm câu đố để chắc' : 'Nên học kỹ']; })) + '<p style="margin-top:12px">' + (first ? 'Gợi ý: bắt đầu từ <b>chặng ' + first.n + '</b>.' : 'Bạn nắm khá vững. Hãy làm các câu đố và lab để chắc từng chỗ.') + '</p><a class="btn go" href="#home" data-reset-place>Về lộ trình</a></div>';
  }
  const l = byId[PLACE_IDS[PL.i]], q = l.quiz[0];
  return '<div style="max-width:720px;margin:0 auto;display:grid;gap:14px"><div><div class="eyebrow">Đo trình độ · câu ' + (PL.i + 1) + '/' + PLACE_IDS.length + '</div><div class="prog" style="margin-top:8px"><i style="width:' + (PL.i / PLACE_IDS.length * 100) + '%"></i></div></div><div class="card" data-ch="' + l.ch + '"><p class="qq" style="font-size:18px">' + q[0] + '</p>' + q[1].map((o, oi) => '<button class="opt ' + (PL.pick === null ? '' : oi === q[2] ? 'right' : oi === PL.pick ? 'wrong' : '') + '" data-po="' + oi + '"' + (PL.pick !== null ? ' disabled' : '') + '>' + o + '</button>').join('') + (PL.pick !== null ? '<div class="why">' + q[3] + '</div><p style="margin-top:12px"><button class="btn pri" data-pnext>Câu tiếp →</button></p>' : '') + '</div></div>';
}

/* ================= Điều hướng và sự kiện ================= */
function render() {
  if (SIMS.timer) { clearInterval(SIMS.timer); SIMS.timer = null; }
  const h = location.hash.slice(1) || 'home'; let html;
  if (h.startsWith('l-')) html = viewLesson(h.slice(2));
  else if (h === 'review') html = viewReview();
  else if (h === 'ref') html = viewRef();
  else if (h === 'interview') html = viewInterview();
  else if (h === 'placement') { if (PL.i >= PLACE_IDS.length || !PL.started) { PL.i = 0; PL.res = []; PL.pick = null; PL.started = true; } html = viewPlacement(); }
  else html = viewHome();
  $('#view').innerHTML = html;
  if (h.startsWith('l-') && byId[h.slice(2)]?.blocks.some((b) => b.t === 'sim')) { SIMS.p = 0; SIMS.i = 0; SIMS.pick = null; renderSim(); }
  if (h === 'ref') { paintRef(); }
  if (h !== 'placement') PL.started = false;
  paintBar(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, a, input'); if (!t) return;
  if (t.matches('[data-copy]')) { const txt = t.closest('.cb').querySelector('code').textContent; const ok = () => { t.textContent = 'Đã chép'; setTimeout(() => (t.textContent = 'Sao chép'), 1200); };
    (navigator.clipboard ? navigator.clipboard.writeText(txt).then(ok) : Promise.reject()).catch(() => { const r = document.createRange(); r.selectNodeContents(t.closest('.cb').querySelector('code')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = 'Đã chọn: Ctrl+C'; }); return; }
  if (t.dataset.scroll) { e.preventDefault(); $('#' + t.dataset.scroll)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.matches('[data-hook]')) { const a = t.closest('.hook').querySelector('.a'); a.hidden = !a.hidden; t.textContent = a.hidden ? 'Xem đáp án' : 'Ẩn đáp án'; return; }
  if (t.dataset.sp !== undefined) { SIMS.p = +t.dataset.sp; SIMS.i = 0; SIMS.pick = null; if (SIMS.timer) { clearInterval(SIMS.timer); SIMS.timer = null; } renderSim(); return; }
  if (t.dataset.pick !== undefined) { SIMS.pick = +t.dataset.pick; renderSim(); return; }
  if (t.dataset.sa) { simAction(t.dataset.sa); return; }
  if (t.dataset.o !== undefined) { const box = t.closest('.qz'); const lid = box.dataset.l, qi = +box.dataset.q, q = byId[lid].quiz[qi], oi = +t.dataset.o; if (store.get('qz:' + lid + ':' + qi) !== null) return;
    const ok = oi === q[2]; store.set('qz:' + lid + ':' + qi, ok ? '1' : '0'); if (ok) { bump('q'); toast('Đúng! +5 XP'); }
    $$('.opt', box).forEach((b, i) => { b.disabled = true; if (i === q[2]) b.classList.add('right'); else if (i === oi) b.classList.add('wrong'); });
    const w = $('.why', box); w.hidden = false; w.innerHTML = '<b>' + (ok ? 'Đúng. ' : 'Chưa đúng. ') + '</b>' + q[3]; paintBar(); return; }
  if (t.dataset.finish) { const id = t.dataset.finish; store.set('done:' + id, today()); bump('l'); toast('Hoàn thành buổi học! +20 XP, ' + byId[id].cards.length + ' thẻ mới'); render(); return; }
  if (t.dataset.undo) { store.del('done:' + t.dataset.undo); render(); return; }
  if (t.matches('[data-reveal]')) { REV.show = true; $('#view').innerHTML = viewReview(); return; }
  if (t.dataset.rate !== undefined) { const x = REV.q[REV.i], good = t.dataset.rate === '1', s = cardSt(x.id) || { b: 0 }; const IV = [1, 3, 7, 14];
    if (good) { s.b = Math.min(4, s.b + 1); s.d = addDays(IV[s.b - 1]); REV.ok++; store.set('rev', String(+(store.get('rev') || 0) + 1)); } else { s.b = 0; s.d = today(); }
    store.set('cd:' + x.id, JSON.stringify(s)); bump('r'); REV.i++; REV.show = false; $('#view').innerHTML = viewReview(); paintBar(); return; }
  if (t.dataset.po !== undefined) { const l = byId[PLACE_IDS[PL.i]]; PL.pick = +t.dataset.po; PL.res.push({ ch: l.ch, ok: PL.pick === l.quiz[0][2] }); $('#view').innerHTML = viewPlacement(); return; }
  if (t.matches('[data-pnext]')) { PL.i++; PL.pick = null; $('#view').innerHTML = viewPlacement(); window.scrollTo(0, 0); return; }
});
document.addEventListener('change', (e) => { const t = e.target; if (t.dataset.lab) { store.set('lab:' + t.dataset.lab, t.checked ? '1' : '0'); toast(t.checked ? 'Lab xong! +15 XP' : 'Đã bỏ đánh dấu lab'); paintBar(); } });
document.addEventListener('input', (e) => { if (e.target.id === 'refq') paintRef(); });
document.addEventListener('mouseover', (e) => { const el = e.target.closest('mark[data-n], .notes li'); if (!el) return; const cb = el.closest('.cb'), n = el.dataset.n; $$('.hot', cb).forEach((x) => x.classList.remove('hot')); $$('[data-n="' + n + '"]', cb).forEach((x) => x.classList.add('hot')); });
document.addEventListener('mouseout', (e) => { const el = e.target.closest('mark[data-n], .notes li'); if (el) $$('.hot', el.closest('.cb')).forEach((x) => x.classList.remove('hot')); });

render();
</script>
</body></html>
